<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配置管理 - 禁售原因配置</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif; background: #f0f2f5; color: #333; }
    .app-container { padding: 20px; }
    .page-header { display: flex; align-items: center; margin-bottom: 20px; }
    .page-header .back-btn { color: #606266; cursor: pointer; margin-right: 12px; font-size: 20px; }
    .page-header .back-btn:hover { color: #ff6600; }
    .page-header h2 { font-size: 18px; font-weight: 600; color: #303133; }
    .card { background: #fff; border-radius: 4px; padding: 20px; margin-bottom: 16px; }
    .btn-primary { background: #ff6600; border-color: #ff6600; color: #fff; }
    .btn-primary:hover { background: #e65c00; border-color: #e65c00; }
    .btn-default { background: #fff; border-color: #dcdfe6; color: #606266; }
    .btn-default:hover { color: #ff6600; border-color: #ff6600; }
    .btn-text { color: #409eff; }
    .btn-text.danger { color: #f56c6c; }
    .el-table th { background: #f5f7fa !important; color: #606266; font-weight: 500; }
    .el-pagination .el-pager li.active { color: #ff6600; }
    .el-pagination button:hover { color: #ff6600; }
    .tab-nav { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 2px solid #ebeef5; }
    .tab-nav-item { padding: 10px 24px; cursor: pointer; font-size: 14px; color: #606266; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.3s; }
    .tab-nav-item:hover { color: #ff6600; }
    .tab-nav-item.active { color: #ff6600; border-bottom-color: #ff6600; font-weight: 500; }
    .search-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; margin-bottom: 16px; }
    .search-item { display: flex; flex-direction: column; }
    .search-item label { font-size: 14px; color: #606266; margin-bottom: 6px; }
    .search-item .el-input, .search-item .el-select { width: 220px; }
    .search-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .btn-search { background: #ff6600; border-color: #ff6600; color: #fff; }
    .btn-search:hover { background: #e65c00; border-color: #e65c00; }
    .btn-reset { background: #fff; border-color: #dcdfe6; color: #606266; }
    .status-enable { color: #67c23a; }
    .status-disable { color: #f56c6c; }
    .el-dialog__header { border-bottom: 1px solid #ebeef5; }
    .el-dialog__title { font-weight: 600; }
    .form-tip { font-size: 12px; color: #909399; margin-top: 4px; }
    .form-error-tip { font-size: 12px; color: #f56c6c; margin-top: 4px; }
    .dialog-section-title { font-size: 14px; font-weight: 600; color: #303133; margin: 16px 0 12px; padding-bottom: 8px; border-bottom: 1px solid #ebeef5; }
    .dialog-section-title:first-child { margin-top: 0; }
    .notifier-cell { line-height: 1.8; font-size: 13px; }
    .notifier-row { display: flex; align-items: flex-start; }
    .notifier-role { color: #909399; flex-shrink: 0; min-width: 72px; }
    .notifier-name { color: #303133; }
    .notifier-platform { color: #409eff; font-size: 12px; }
  </style>
</head>
<body>
<div id="app">
  <div class="app-container">
    <!-- 页面标题 -->
    <div class="page-header">
      <i class="el-icon-arrow-left back-btn" @click="goBack"></i>
      <h2>配置管理</h2>
    </div>

    <!-- 禁售原因配置 -->
    <div class="card">
      <div class="card-title" style="font-size:16px;font-weight:600;color:#303133;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #ebeef5;">禁售原因配置</div>
        <div class="search-row">
          <div class="search-item">
            <label>一级禁售原因</label>
            <el-input v-model="reasonSearch.primaryReason" placeholder="请输入" size="small" clearable></el-input>
          </div>
          <div class="search-item">
            <label>二级禁售原因</label>
            <el-input v-model="reasonSearch.secondaryReason" placeholder="请输入" size="small" clearable></el-input>
          </div>
          <div class="search-item">
            <label>状态</label>
            <el-select v-model="reasonSearch.status" placeholder="请选择" size="small" clearable>
              <el-option label="启用" value="enable"></el-option>
              <el-option label="停用" value="disable"></el-option>
            </el-select>
          </div>
          <div class="search-actions">
            <el-button size="small" class="btn-search" @click="searchReason">查 询</el-button>
            <el-button size="small" class="btn-reset" @click="resetReasonSearch">重 置</el-button>
          </div>
        </div>

        <div style="margin-bottom: 16px;">
          <el-button size="small" class="btn-primary" @click="openReasonDialog()">新增</el-button>
        </div>

        <el-table :data="reasonTableData" border style="width: 100%">
          <el-table-column prop="primaryReason" label="一级禁售原因" min-width="120"></el-table-column>
          <el-table-column prop="secondaryReason" label="二级禁售原因" min-width="120"></el-table-column>
          <el-table-column label="告知人" min-width="280">
            <template slot-scope="scope">
              <div class="notifier-cell">
                <div class="notifier-row" v-if="scope.row.productNotifiers">
                  <span class="notifier-role">产品告知人：</span>
                  <span class="notifier-name">{{ scope.row.productNotifiers }}</span>
                </div>
                <div class="notifier-row" v-if="scope.row.opsNotifiersList && scope.row.opsNotifiersList.length">
                  <span class="notifier-role">运营告知人：</span>
                  <span class="notifier-name">{{ scope.row.opsNotifiersList.map(op => op.name).join('、') }}</span>
                </div>
                <div class="notifier-row" v-else-if="scope.row.opsNotifiers">
                  <span class="notifier-role">运营告知人：</span>
                  <span class="notifier-name">{{ scope.row.opsNotifiers }}</span>
                </div>
                <div class="notifier-row" v-if="scope.row.planNotifiers">
                  <span class="notifier-role">计划告知人：</span>
                  <span class="notifier-name">{{ scope.row.planNotifiers }}</span>
                </div>
                <div class="notifier-row" v-if="scope.row.purchaseNotifiers">
                  <span class="notifier-role">采购告知人：</span>
                  <span class="notifier-name">{{ scope.row.purchaseNotifiers }}</span>
                </div>
                <div class="notifier-row" v-if="scope.row.logisticsNotifiers">
                  <span class="notifier-role">物流告知人：</span>
                  <span class="notifier-name">{{ scope.row.logisticsNotifiers }}</span>
                </div>
                <div class="notifier-row" v-if="scope.row.serviceNotifiers">
                  <span class="notifier-role">客服告知人：</span>
                  <span class="notifier-name">{{ scope.row.serviceNotifiers }}</span>
                </div>
              </div>
            </template>
          </el-table-column>
          <el-table-column prop="responsibleDept" label="禁售责任部门" min-width="120"></el-table-column>
          <el-table-column prop="createTime" label="创建时间" min-width="160"></el-table-column>
          <el-table-column prop="status" label="状态" width="80" align="center">
            <template slot-scope="scope">
              <span style="color: #333;">
                {{ scope.row.status === 'enable' ? '启用' : '停用' }}
              </span>
            </template>
          </el-table-column>
          <el-table-column label="操作" width="180" fixed="right">
            <template slot-scope="scope">
              <el-button type="text" size="small" class="btn-text" @click="openReasonDialog(scope.row, 'edit')">编辑</el-button>
              <el-button type="text" size="small" class="btn-text" @click="toggleReasonStatus(scope.row)">
                {{ scope.row.status === 'enable' ? '停用' : '启用' }}
              </el-button>
              <el-button type="text" size="small" class="btn-text" @click="deleteReason(scope.row)">删除</el-button>
            </template>
          </el-table-column>
        </el-table>

        <div style="margin-top: 16px; text-align: right;">
          <el-pagination
            background
            layout="total, prev, pager, next, jumper"
            :total="reasonTotal"
            :page-size="10"
            :current-page="reasonPage"
            @current-change="reasonPage = $event">
          </el-pagination>
        </div>
      </div>

    </div>

    <!-- 禁售原因新增/编辑弹窗 -->
    <el-dialog :title="reasonDialogTitle" :visible.sync="reasonDialogVisible" width="650px" :close-on-click-modal="false">
      <el-form :model="reasonForm" label-width="110px" size="medium" ref="reasonForm">
        <div class="dialog-section-title">禁售原因</div>
        <el-form-item label="一级禁售原因" required :class="{ 'form-item-error': reasonErrors.primaryReason }">
          <el-input v-model="reasonForm.primaryReason" placeholder="请输入" maxlength="50" show-word-limit></el-input>
          <div class="form-error-tip" v-if="reasonErrors.primaryReason">请输入一级禁售原因</div>
        </el-form-item>
        <el-form-item label="二级禁售原因">
          <el-input v-model="reasonForm.secondaryReason" placeholder="请输入" maxlength="50" show-word-limit></el-input>
        </el-form-item>

        <div class="dialog-section-title">告知人配置</div>
        <el-form-item label="产品告知人">
          <el-select v-model="reasonForm.productNotifiers" multiple filterable placeholder="请选择" style="width: 100%;">
            <el-option v-for="u in allUsers" :key="u.value" :label="u.label" :value="u.value"></el-option>
          </el-select>
          <div class="form-tip">除此之外会默认告知sku对应品类经理</div>
        </el-form-item>
        <el-form-item label="运营告知人">
          <el-select v-model="reasonForm.opsNotifiers" multiple filterable placeholder="请选择" style="width: 100%;">
            <el-option v-for="u in allUsers" :key="u.value" :label="u.label" :value="u.value"></el-option>
          </el-select>
          <div class="form-tip">除此之外会默认告知sku对应运营人员</div>
        </el-form-item>
        <el-form-item label="计划告知人">
          <el-select v-model="reasonForm.planNotifiers" multiple filterable placeholder="请选择" style="width: 100%;">
            <el-option v-for="u in allUsers" :key="u.value" :label="u.label" :value="u.value"></el-option>
          </el-select>
          <div class="form-tip">除此之外会默认告知sku对应计划人员</div>
        </el-form-item>
        <el-form-item label="采购告知人">
          <el-select v-model="reasonForm.purchaseNotifiers" multiple filterable placeholder="请选择" style="width: 100%;">
            <el-option v-for="u in allUsers" :key="u.value" :label="u.label" :value="u.value"></el-option>
          </el-select>
          <div class="form-tip">除此之外会默认告知sku对应采购人员</div>
        </el-form-item>
        <el-form-item label="物流告知人">
          <el-select v-model="reasonForm.logisticsNotifiers" multiple filterable placeholder="请选择" style="width: 100%;">
            <el-option v-for="u in allUsers" :key="u.value" :label="u.label" :value="u.value"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="客服告知人">
          <el-select v-model="reasonForm.serviceNotifiers" multiple filterable placeholder="请选择" style="width: 100%;">
            <el-option v-for="u in allUsers" :key="u.value" :label="u.label" :value="u.value"></el-option>
          </el-select>
        </el-form-item>

        <div class="dialog-section-title">责任部门</div>
        <el-form-item label="禁售责任部门" required :class="{ 'form-item-error': reasonErrors.responsibleDept }">
          <el-select v-model="reasonForm.responsibleDept" multiple filterable placeholder="请选择" style="width: 100%;">
            <el-option v-for="d in allDepartments" :key="d.value" :label="d.label" :value="d.value"></el-option>
          </el-select>
          <div class="form-error-tip" v-if="reasonErrors.responsibleDept">请选择禁售责任部门</div>
        </el-form-item>
      </el-form>
      <div slot="footer">
        <el-button size="small" @click="reasonDialogVisible = false">取 消</el-button>
        <el-button size="small" class="btn-primary" @click="confirmReason">确 认</el-button>
      </div>
    </el-dialog>

    <!-- 删除确认弹窗 -->
    <el-dialog title="提示" :visible.sync="deleteConfirmVisible" width="400px" :close-on-click-modal="false">
      <span>{{ deleteConfirmMsg }}</span>
      <div slot="footer">
        <el-button size="small" @click="deleteConfirmVisible = false">取 消</el-button>
        <el-button size="small" class="btn-primary" @click="confirmDelete">确 定</el-button>
      </div>
    </el-dialog>
  </div>
</div>

<script src="https://unpkg.com/vue@2.6.14/dist/vue.js"></script>
<script src="https://unpkg.com/element-ui/lib/index.js"></script>
<script>
new Vue({
  el: '#app',
  data() {
    return {
      // 搜索条件
      reasonSearch: { primaryReason: '', secondaryReason: '', status: '' },

      // 用户和部门数据
      allUsers: [
        { value: 'zhangsan', label: '张三 - 产品部' },
        { value: 'lisi', label: '李四 - 运营部' },
        { value: 'wangwu', label: '王五 - 计划部' },
        { value: 'zhaoliu', label: '赵六 - 采购部' },
        { value: 'sunqi', label: '孙七 - 物流部' },
        { value: 'zhouba', label: '周八 - 客服部' },
        { value: 'wujiu', label: '吴九 - 合规部' },
        { value: 'zhengshi', label: '郑十 - 供应链部' }
      ],
      allDepartments: [
        { value: 'product', label: '产品部' },
        { value: 'operations', label: '运营部' },
        { value: 'planning', label: '计划部' },
        { value: 'procurement', label: '采购部' },
        { value: 'logistics', label: '物流部' },
        { value: 'customer_service', label: '客服部' },
        { value: 'compliance', label: '合规部' },
        { value: 'supply_chain', label: '供应链部' }
      ],

      // 禁售原因列表数据
      reasonTableData: [
        {
          id: 1, primaryReason: '侵权', secondaryReason: '专利侵权',
          productNotifiers: '张三', opsNotifiers: '李四',
          opsNotifiersList: [{ name: '李四', platform: 'Amazon' }],
          planNotifiers: '王五', purchaseNotifiers: '赵六',
          logisticsNotifiers: '孙七', serviceNotifiers: '周八',
          responsibleDept: '产品部', createTime: '2026-01-15 10:00:00', status: 'enable'
        },
        {
          id: 2, primaryReason: '侵权', secondaryReason: '商标侵权',
          productNotifiers: '张三', opsNotifiers: '李四',
          opsNotifiersList: [{ name: '李四', platform: 'Amazon' }],
          planNotifiers: '王五', purchaseNotifiers: '赵六',
          logisticsNotifiers: '孙七', serviceNotifiers: '周八',
          responsibleDept: '产品部', createTime: '2026-01-15 10:05:00', status: 'enable'
        },
        {
          id: 3, primaryReason: '侵权', secondaryReason: '版权侵权',
          productNotifiers: '张三', opsNotifiers: '李四',
          opsNotifiersList: [{ name: '李四', platform: 'Amazon' }],
          planNotifiers: '王五', purchaseNotifiers: '赵六',
          logisticsNotifiers: '孙七', serviceNotifiers: '周八',
          responsibleDept: '合规部', createTime: '2026-01-15 10:10:00', status: 'disable'
        },
        {
          id: 4, primaryReason: '质量问题', secondaryReason: '产品缺陷',
          productNotifiers: '张三', opsNotifiers: '李四',
          opsNotifiersList: [{ name: '李四', platform: 'Amazon' }],
          planNotifiers: '王五', purchaseNotifiers: '赵六',
          logisticsNotifiers: '孙七', serviceNotifiers: '周八',
          responsibleDept: '产品部', createTime: '2026-02-01 09:00:00', status: 'enable'
        },
        {
          id: 5, primaryReason: '质量问题', secondaryReason: '投诉率过高',
          productNotifiers: '张三', opsNotifiers: '李四',
          opsNotifiersList: [{ name: '李四', platform: 'Amazon' }],
          planNotifiers: '王五', purchaseNotifiers: '赵六',
          logisticsNotifiers: '孙七', serviceNotifiers: '周八',
          responsibleDept: '客服部', createTime: '2026-02-01 09:05:00', status: 'enable'
        },
        {
          id: 6, primaryReason: '合规问题', secondaryReason: '不符合法规',
          productNotifiers: '吴九', opsNotifiers: '李四',
          opsNotifiersList: [{ name: '李四', platform: 'Amazon' }],
          planNotifiers: '王五', purchaseNotifiers: '赵六',
          logisticsNotifiers: '孙七', serviceNotifiers: '周八',
          responsibleDept: '合规部', createTime: '2026-03-10 14:00:00', status: 'enable'
        },
        {
          id: 7, primaryReason: '利润不达标', secondaryReason: '毛利率过低',
          productNotifiers: '张三', opsNotifiers: '李四',
          opsNotifiersList: [{ name: '李四', platform: 'Amazon' }],
          planNotifiers: '王五', purchaseNotifiers: '赵六',
          logisticsNotifiers: '孙七', serviceNotifiers: '周八',
          responsibleDept: '运营部', createTime: '2026-04-20 11:00:00', status: 'enable'
        }
      ],

      // 分页
      reasonTotal: 7,
      reasonPage: 1,

      // 禁售原因弹窗
      reasonDialogVisible: false,
      reasonDialogTitle: '新增禁售原因',
      reasonForm: {
        id: null, primaryReason: '', secondaryReason: '',
        productNotifiers: [], opsNotifiers: [], planNotifiers: [],
        purchaseNotifiers: [], logisticsNotifiers: [], serviceNotifiers: [],
        responsibleDept: []
      },
      reasonErrors: { primaryReason: false, responsibleDept: false },

      // 删除确认
      deleteConfirmVisible: false,
      deleteConfirmMsg: '',
      deleteCallback: null
    };
  },
  methods: {
    goBack() {
      window.location.href = 'prohibited-management.html';
    },

    // 禁售原因
    searchReason() { this.$message.success('查询成功'); },
    resetReasonSearch() { this.reasonSearch = { primaryReason: '', secondaryReason: '', status: '' }; },

    openReasonDialog(row, mode) {
      this.reasonErrors = { primaryReason: false, responsibleDept: false };
      if (mode === 'edit' && row) {
        this.reasonDialogTitle = '编辑禁售原因';
        const deptMap = { '产品部': 'product', '运营部': 'operations', '计划部': 'planning', '采购部': 'procurement', '物流部': 'logistics', '客服部': 'customer_service', '合规部': 'compliance', '供应链部': 'supply_chain' };
        const userMap = { '张三': 'zhangsan', '李四': 'lisi', '王五': 'wangwu', '赵六': 'zhaoliu', '孙七': 'sunqi', '周八': 'zhouba', '吴九': 'wujiu', '郑十': 'zhengshi' };
        this.reasonForm = {
          id: row.id,
          primaryReason: row.primaryReason,
          secondaryReason: row.secondaryReason || '',
          productNotifiers: row.productNotifiers ? [userMap[row.productNotifiers] || ''] : [],
          opsNotifiers: row.opsNotifiers ? [userMap[row.opsNotifiers] || ''] : [],
          planNotifiers: row.planNotifiers ? [userMap[row.planNotifiers] || ''] : [],
          purchaseNotifiers: row.purchaseNotifiers ? [userMap[row.purchaseNotifiers] || ''] : [],
          logisticsNotifiers: row.logisticsNotifiers ? [userMap[row.logisticsNotifiers] || ''] : [],
          serviceNotifiers: row.serviceNotifiers ? [userMap[row.serviceNotifiers] || ''] : [],
          responsibleDept: row.responsibleDept ? [deptMap[row.responsibleDept] || ''] : []
        };
      } else {
        this.reasonDialogTitle = '新增禁售原因';
        this.reasonForm = {
          id: null, primaryReason: '', secondaryReason: '',
          productNotifiers: [], opsNotifiers: [], planNotifiers: [],
          purchaseNotifiers: [], logisticsNotifiers: [], serviceNotifiers: [],
          responsibleDept: []
        };
      }
      this.reasonDialogVisible = true;
    },

    confirmReason() {
      this.reasonErrors = { primaryReason: false, responsibleDept: false };
      let hasError = false;

      if (!this.reasonForm.primaryReason) {
        this.reasonErrors.primaryReason = true;
        hasError = true;
      }
      if (!this.reasonForm.responsibleDept || this.reasonForm.responsibleDept.length === 0) {
        this.reasonErrors.responsibleDept = true;
        hasError = true;
      }

      if (hasError) return;

      const userLabelMap = { zhangsan: '张三', lisi: '李四', wangwu: '王五', zhaoliu: '赵六', sunqi: '孙七', zhouba: '周八', wujiu: '吴九', zhengshi: '郑十' };
      const deptLabelMap = { product: '产品部', operations: '运营部', planning: '计划部', procurement: '采购部', logistics: '物流部', customer_service: '客服部', compliance: '合规部', supply_chain: '供应链部' };

      const now = new Date();
      const timeStr = now.getFullYear() + '-' +
        String(now.getMonth() + 1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0') + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0') + ':' +
        String(now.getSeconds()).padStart(2, '0');

      const opsNames = this.reasonForm.opsNotifiers.map(v => userLabelMap[v] || v);
      const opsList = opsNames.map(name => ({ name: name, platform: 'Amazon' }));

      const newItem = {
        id: this.reasonForm.id || Date.now(),
        primaryReason: this.reasonForm.primaryReason,
        secondaryReason: this.reasonForm.secondaryReason,
        productNotifiers: this.reasonForm.productNotifiers.map(v => userLabelMap[v] || v).join('、'),
        opsNotifiers: opsNames.join('、'),
        opsNotifiersList: opsList,
        planNotifiers: this.reasonForm.planNotifiers.map(v => userLabelMap[v] || v).join('、'),
        purchaseNotifiers: this.reasonForm.purchaseNotifiers.map(v => userLabelMap[v] || v).join('、'),
        logisticsNotifiers: this.reasonForm.logisticsNotifiers.map(v => userLabelMap[v] || v).join('、'),
        serviceNotifiers: this.reasonForm.serviceNotifiers.map(v => userLabelMap[v] || v).join('、'),
        responsibleDept: this.reasonForm.responsibleDept.map(v => deptLabelMap[v] || v).join('、'),
        createTime: this.reasonForm.id ? this.reasonTableData.find(r => r.id === this.reasonForm.id)?.createTime || timeStr : timeStr,
        status: 'enable'
      };

      if (this.reasonForm.id) {
        const idx = this.reasonTableData.findIndex(r => r.id === this.reasonForm.id);
        if (idx !== -1) {
          this.reasonTableData.splice(idx, 1, newItem);
        }
        this.$message.success('编辑成功');
      } else {
        this.reasonTableData.unshift(newItem);
        this.reasonTotal++;
        this.$message.success('创建成功');
      }

      this.reasonDialogVisible = false;
    },

    toggleReasonStatus(row) {
      row.status = row.status === 'enable' ? 'disable' : 'enable';
      this.$message.success(row.status === 'enable' ? '启用成功' : '停用成功');
    },

    deleteReason(row) {
      this.deleteConfirmMsg = '确认删除该禁售原因？';
      this.deleteCallback = () => {
        const idx = this.reasonTableData.findIndex(r => r.id === row.id);
        if (idx !== -1) {
          this.reasonTableData.splice(idx, 1);
          this.reasonTotal--;
        }
        this.$message.success('删除成功');
      };
      this.deleteConfirmVisible = true;
    },

    confirmDelete() {
      if (this.deleteCallback) this.deleteCallback();
      this.deleteConfirmVisible = false;
    }
  }
});
</script>
</body>
</html>
